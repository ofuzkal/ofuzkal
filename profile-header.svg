<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Ömer Faruk Uzkal — Network Specialist</title>
  <desc id="desc">Animated GitHub profile banner for Network, Systems and Security</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="48%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7">
        <animate attributeName="stop-color" values="#2f81f7;#00d4ff;#7c3aed;#2f81f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7c3aed;#2f81f7;#00d4ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#2f81f7;#00d4ff;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>

  <circle cx="1080" cy="68" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;190;150" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="260" r="145" fill="url(#glow)" opacity="0.45"/>

  <g opacity="0.34" stroke="#58a6ff" stroke-width="1.4" fill="none">
    <path d="M760 52 L862 103 L970 56 L1080 112"/>
    <path d="M790 194 L900 146 L1016 198 L1124 151"/>
    <path d="M862 103 L900 146 M970 56 L1016 198 M1080 112 L1124 151"/>
  </g>

  <g fill="#79c0ff" filter="url(#softGlow)">
    <circle cx="760" cy="52" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="862" cy="103" r="5"><animate attributeName="opacity" values="1;.35;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="56" r="4"><animate attributeName="opacity" values=".4;1;.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="112" r="5"><animate attributeName="opacity" values="1;.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="194" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="146" r="5"><animate attributeName="opacity" values="1;.35;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1016" cy="198" r="4"><animate attributeName="opacity" values=".45;1;.45" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1124" cy="151" r="5"><animate attributeName="opacity" values="1;.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="62" y="48" width="6" height="150" rx="3" fill="url(#accent)"/>

  <text x="92" y="104" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Ömer Faruk Uzkal</text>
  <text x="92" y="151" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Network Specialist</text>
  <text x="92" y="197" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">Network  •  Systems  •  Security</text>

  <rect x="62" y="248" width="1076" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>